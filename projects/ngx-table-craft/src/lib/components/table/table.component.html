<mat-form-field class="search-input">
  <mat-label>Buscar</mat-label>
  <input
    matInput
    (keyup)="applyFilter($event)"
    [placeholder]="filterPlaceHolder"
    #input
  />
</mat-form-field>

<div class="scrollable-content">
  <table mat-table [dataSource]="dataSource" matSort>
    @for (item of displayedColumns; track $index) {

    <ng-container matColumnDef="{{ item }}">
      <th class="no-select" mat-header-cell *matHeaderCellDef mat-sort-header>
        <div>
        	<strong>{{ configs.headers[$index] }}</strong>
        </div>
      </th>
      <td mat-cell *matCellDef="let element">{{ element[item] }}</td>
      <td mat-footer-cell *matFooterCellDef>{{ configs.footers[$index] }}</td>
    </ng-container>

    }

    <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
    <tr mat-row *matRowDef="let element; columns: displayedColumns" (click)="onRowClick(element)"></tr>
    <tr mat-footer-row *matFooterRowDef="displayedColumns"></tr>

    <!-- Row shown when there is no matching data. -->
    <tr class="mat-row" *matNoDataRow>
      <td class="mat-cell text-center" colspan="4">
        <h6 class="mt-3">
          No hay datos para el filtro: {{ input.value }}
        </h6>
      </td>
    </tr>
  </table>
</div>
<mat-paginator
  [pageSizeOptions]="[5, 10, 25, 100]"
  aria-label="Select page of data"
></mat-paginator>
