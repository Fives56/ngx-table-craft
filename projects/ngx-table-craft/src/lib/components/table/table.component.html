<div class="d-flex">
  <div class="col-lg-3 col-md-6 col-sm-12 p-2">
    <label for="name" class="form-label">Buscar</label>
    <input
      class="form-control"
      matInput
      (keyup)="applyFilter($event)"
      placeholder="...."
      #input
    />
  </div>  
</div>

<div >
  <table mat-table [dataSource]="dataSource" matSort>
    @for (item of displayedColumns; track $index) {

    <ng-container matColumnDef="{{ item }}">
      <th class="no-select" mat-header-cell *matHeaderCellDef mat-sort-header>
        <div>
        	<strong>{{ configs.headers[$index] }}</strong>
        </div>
      </th>
      <td mat-cell *matCellDef="let element">{{ getNestedProperty(element, item) }}</td>
      <td mat-footer-cell *matFooterCellDef>{{ typeof configs.footers[$index] === 'function' ? configs.footers[$index](dataSource.data) : configs.footers[$index] }}</td>
    </ng-container>

    }

    <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
    <tr mat-row class="mat-row" *matRowDef="let element; columns: displayedColumns" (click)="onRowClick(element)"></tr>
    <tr mat-footer-row *matFooterRowDef="displayedColumns"></tr>

    <!-- Row shown when there is no matching data. -->
    <tr class="mat-row" *matNoDataRow>
      <td class="mat-cell text-center" [attr.colspan]="colspan">
        <div class="alert alert-warning w-50 m-auto mt-3" role="alert">
          <i class="bi bi-exclamation-triangle-fill"></i><strong class="ms-2">No hay datos en la tabla</strong>
        </div>
      </td>
    </tr>
  </table>
</div>
<mat-paginator
  [pageSizeOptions]="[5, 10, 25, 100]"
  aria-label="Select page of data"
></mat-paginator>
